services:
  mongo:
    image: mongo:7
    container_name: wb-mongo
    # Single-node replica set: required for change streams and transactions,
    # and matches the Atlas topology the project targets.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:27017 --quiet --eval '
          try { rs.status().ok } catch (e) {
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})
          }
        '

  redis:
    image: redis:7-alpine
    container_name: wb-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mongo-data:
